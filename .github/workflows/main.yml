name: Build Vibe-Live APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Dependencies - FIXED
        run: npm install --legacy-peer-deps

      - name: Build Web App
        run: npm run build

      - name: Install Capacitor
        run: npm install @capacitor/core @capacitor/cli @capacitor/android --legacy-peer-deps

      - name: Build APK with Capacitor
        run: |
          npx cap init Vibe-Live com.vibelive.app --web-dir=dist || true
          if [ ! -d "android" ]; then npx cap add android; fi
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload Vibe-Live APK
        uses: actions/upload-artifact@v4
        with:
          name: Vibe-Live-APK-v1.0
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
